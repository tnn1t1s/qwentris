[project]
name = "deltris"
version = "0.0.1"
description = "Tetris compiled into Gated DeltaNet weights"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "torch>=2.15.0",
    "transformers==5.22.1",
]

[dependency-groups]
dev = ["pytest", "pytest-cov"]
viz = [
    "imageio-ffmpeg>=0.8.1",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deltris"]
